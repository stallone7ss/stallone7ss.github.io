<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact KILSTA Business & ICT Consultants — Alotau, Milne Bay Province</title>
    <meta name="description" content="Contact KILSTA Business & ICT Consultants in Alotau, Milne Bay Province. Call +675 82545274, email kilsta2023@gmail.com, or send us a message about business, ICT or training support." />
    <meta name="theme-color" content="#0a1430" />
    <link rel="icon" href="assets/img/favicon.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      document.documentElement.classList.add("js");
      setTimeout(function () {
        if (!document.documentElement.hasAttribute("data-js-ready")) {
          document.documentElement.classList.remove("js");
        }
      }, 5000);
    </script>
  </head>

  <body class="bg-white">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100] focus:rounded-lg focus:bg-navy-900 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">Skip to main content</a>

<!-- ============================== HEADER ============================== -->
    <header data-header>
      <div class="container-page flex h-16 items-center justify-between gap-4 lg:h-20">
        <div class="flex items-center gap-6 lg:gap-8">
          <a href="index.html" class="flex shrink-0 items-center" aria-label="KILSTA Business &amp; ICT Consultants — home">
            <img src="assets/img/logo.jpg" alt="" class="block size-5 object-contain" />
          </a>

          <nav class="hidden items-center gap-1 lg:flex" aria-label="Primary">
            <a href="index.html" class="nav-link" data-nav="home">Home</a>
            <a href="services.html" class="nav-link" data-nav="services">Services</a>
            <a href="industries.html" class="nav-link" data-nav="industries">Industries</a>
            <a href="about.html" class="nav-link" data-nav="about">About</a>
            <a href="resources.html" class="nav-link" data-nav="resources">Resources</a>
            <a href="contact.html" class="nav-link" data-nav="contact" aria-current="page">Contact</a>
          </nav>
        </div>

        <div class="flex items-center gap-2">
          <button type="button" data-modal-open="audit-modal" class="btn-primary btn-sm hidden sm:inline-flex">Get a Free Quote</button>
          <button type="button" data-nav-toggle aria-expanded="false" aria-controls="mobile-menu" class="btn-outline btn-sm -mr-1 size-10 justify-center p-0 lg:hidden">
            <span class="sr-only">Open main menu</span>
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" /></svg>
          </button>
        </div>
      </div>
    </header>

<!-- ============================== MAIN CONTENT FORM ============================== -->
    <main id="main">
      <section class="py-12 lg:py-20 bg-slate-50">
        <div class="container-page max-w-3xl bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
          <h1 class="text-2xl font-bold text-navy-900 mb-1">Send us a message</h1>
          <p class="text-xs text-slate-500 mb-6">Fields marked * are required. We reply during Monday–Friday business hours.</p>
          
          <form id="contactForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Full name *</label>
                <input type="text" id="full_name" required class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-500" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Email *</label>
                <input type="email" id="email" required class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-500" />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Business / organisation (optional)</label>
                <input type="text" id="business_organisation" class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-500" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Phone (optional)</label>
                <input type="text" id="phone" class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-500" />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Who is this for?</label>
                <select id="who_is_this_for" class="w-full border border-slate-200 rounded-xl p-3 text-sm bg-slate-50 outline-none focus:bg-white focus:border-blue-500">
                  <option value="Myself">Myself</option>
                  <option value="My Business">My Business</option>
                  <option value="An Organisation">An Organisation</option>
                  <option value="Government / LLG">Government / LLG</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Service needed *</label>
                <select id="service_needed" required class="w-full border border-slate-200 rounded-xl p-3 text-sm bg-slate-50 outline-none focus:bg-white focus:border-blue-500">
                  <option value="Business Consulting">Business Consulting</option>
                  <option value="ICT Services">ICT Services</option>
                  <option value="ICT Support & Training">ICT Support & Training</option>
                  <option value="Computers & Hardware Maintenance">Computers & Hardware Maintenance</option>
                  <option value="Web Development">Web Development</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">How can we help? *</label>
              <textarea id="message" required rows="4" class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-500" placeholder="Minimum 20 characters."></textarea>
            </div>

            <div class="flex items-start gap-2.5 pt-2">
              <input type="checkbox" id="gdpr_consent_agreed" required class="mt-0.5 rounded text-blue-600 focus:ring-blue-500" />
              <label for="gdpr_consent_agreed" class="text-xs text-slate-500">I agree to KILSTA Business & ICT Consultants contacting me about this request. *</label>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3.5 rounded-xl hover:bg-blue-700 transition-colors mt-4">
              Send my message &rarr;
            </button>
          </form>
        </div>
      </section>
    </main>

<!-- ============================== DATA ROUTING BRIDGE ============================== -->
    <script>
      document.getElementById('contactForm').addEventListener('submit', async function(e) {
          e.preventDefault();

          const formData = {
              full_name: document.getElementById('full_name').value,
              email: document.getElementById('email').value,
              business_organisation: document.getElementById('business_organisation').value,
              phone: document.getElementById('phone').value,
              who_is_this_for: document.getElementById('who_is_this_for').value,
              service_needed: document.getElementById('service_needed').value,
              message: document.getElementById('message').value,
              gdpr_consent_agreed: document.getElementById('gdpr_consent_agreed').checked
          };

          try {
              const response = await fetch('http://127.0.0', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(formData)
              });

              const result = await response.json();
              if (response.status === 201) {
                  alert('🎉 Form submitted successfully! Saved with Submission ID: ' + result.submission_id);
                  document.getElementById('contactForm').reset();
              } else {
                  alert('❌ Server Rejected Request: ' + result.message);
              }
          } catch (error) {
              alert('❌ Network connection broken! Make sure your black command prompt window is running.');
          }
      });
    </script>
  </body>
</html>
